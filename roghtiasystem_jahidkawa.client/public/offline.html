<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d9488">
    <title>E-Roghtia is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f8f8; color: #173a3b; }
      main { width: min(28rem, calc(100% - 2rem)); padding: 2rem; box-sizing: border-box; border: 1px solid #d6e8e6; border-radius: 1.25rem; background: white; box-shadow: 0 14px 40px #173a3b12; text-align: center; }
      .icon { display: grid; place-items: center; width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; border-radius: 1rem; background: #0d9488; color: white; font-size: 1.8rem; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; } p { color: #617879; line-height: 1.7; }
      button { margin-top: .75rem; padding: .75rem 1.1rem; border: 0; border-radius: .75rem; background: #0d9488; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #102223; color: #ecf6f5; } main { background: #182f30; border-color: #315050; } p { color: #b3c8c8; } }
    </style>
  </head>
  <body>
    <main>
      <span class="icon" aria-hidden="true">&#9829;</span>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to open E-Roghtia. For your privacy, patient and account data are not stored for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
